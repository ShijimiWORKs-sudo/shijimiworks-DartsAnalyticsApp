[project]
name = "dartsanalytics"
version = "0.0.1"
description = "DARTSLIVE HOME COUNT-UP throw/form analytics — local-first."
requires-python = ">=3.10"
# Phase 0/1 intentionally have zero third-party runtime dependencies
# (stdlib sqlite3 + dataclasses only). New dependencies are added only
# when a later phase genuinely needs them (see AGENTS.md rule:
# "新規依存関係は必要性を確認").
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
