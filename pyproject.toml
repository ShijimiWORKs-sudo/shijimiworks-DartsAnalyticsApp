[project]
name = "dartsanalytics"
version = "0.0.1"
description = "DARTSLIVE HOME COUNT-UP throw/form analytics — local-first."
requires-python = ">=3.10"
# Phase 0/1 shipped with zero third-party dependencies (stdlib sqlite3 +
# dataclasses only). Phase 3 (board coordinate analysis) needs image I/O
# and array/statistics math that stdlib does not provide, so it adds:
#   - numpy: grouping statistics (std/covariance/percentiles/histograms)
#   - Pillow: reading board photos and building synthetic test images
# A full computer-vision library (opencv) is deliberately NOT added yet —
# Phase 3's calibration algorithm only needs thresholding + centroid/area,
# not Hough transforms. Revisit if a later phase needs more (see AGENTS.md
# rule: "新規依存関係は必要性を確認").
#
# Phase 5 (pose analysis, docs §13) adds:
#   - mediapipe: real pose landmark detection (BlazePose via the Tasks
#     API). Hand-rolling a pose estimator is out of scope; this is the
#     standard lightweight/CPU-friendly choice. IMPORTANT: mediapipe also
#     needs a one-time local model-file download (not a pip dependency) —
#     see models/README.md. ffmpeg/ffprobe (Phase 4) are a similar
#     external-binary dependency, also not installable via pip.
#
# Phase 6 (grip analysis, docs §Phase6) reuses mediapipe (no new pip
# dependency) via its HandLandmarker model — a second, separate .task
# file download (see models/README.md).
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "mediapipe>=0.10.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
